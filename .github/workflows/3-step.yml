name: Step 3

on:
  push:
    branches:
      - main
    paths:
      - '.vscode/mcp.json'
  # 保險機制:卡關時可以到 Actions 頁籤手動執行這支 workflow 強制推進
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

env:
  NEXT_STEP_FILE: ".github/steps/4-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    needs: [find_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      # START: 檢查這一關的產出
      - name: Check if .vscode/mcp.json exists
        id: check-mcp-json
        continue-on-error: true
        uses: skills/exercise-toolkit/actions/file-exists@v0.9.3
        with:
          file: '.vscode/mcp.json'

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 3
            results_table:
              - description: "建立了 .vscode/mcp.json"
                passed: ${{ steps.check-mcp-json.outcome == 'success' }}

      # END: 檢查這一關的產出

      # 手動觸發(workflow_dispatch)時不擋關,讓卡住的學員能強制推進
      - name: Fail job if not all checks passed
        if: github.event_name != 'workflow_dispatch' && contains(steps.*.outcome, 'failure')
        run: exit 1

  create_issues:
    name: Create issues for the next step
    runs-on: ubuntu-latest
    needs: [check_step_work]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create issues from markdown files
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            async function createIssuesFromMarkdownFiles(dir, label) {
              if (!fs.existsSync(dir)) {
                console.log(`Skipping missing folder: ${dir}`);
                return;
              }

              const files = fs.readdirSync(dir).filter((f) => f.endsWith('.md')).sort();
              console.log(`Creating ${files.length} issues with '${label}' label from '${dir}'.`);

              for (const file of files) {
                const fileContent = fs.readFileSync(path.join(dir, file), 'utf8');

                const title = fileContent.split('\n')[0].replace('#', '').trim();
                const body = fileContent.split('\n').slice(1).join('\n').split('----- COMMENTS -----')[0].trim();
                const comments = fileContent
                  .split('----- COMMENTS -----')
                  .slice(1)
                  .join('\n')
                  .trim()
                  .split('\n')
                  .filter((comment) => comment.trim() !== '');

                const issue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [label],
                });

                for (const comment of comments) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.data.number,
                    body: comment,
                  });
                }

                console.log(`Created issue: ${title} -> ${issue.data.html_url}`);
              }
            }

            await createIssuesFromMarkdownFiles('.github/steps/3-step-issues/bug/', 'bug');
            await createIssuesFromMarkdownFiles('.github/steps/3-step-issues/enhancement/', 'enhancement');

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work, create_issues]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 4

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.NEXT_STEP_FILE }}
          vars: |
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 4"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
